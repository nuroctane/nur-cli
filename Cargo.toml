[package]
name = "nur-cli"
version = "0.53.2"
edition = "2021"
description = "NurCLI - fully loaded multi-provider coding agent (TUI, inline kitty/sixel vision, tools, sandbox, TypeSafe/Jev typed judgments with local engines, Graphify/PLUR/Ruflo/Executor + sc-research whitehat pack + historical SC vuln library)."
license = "GPL-3.0-or-later"
authors = ["NurCLI contributors"]
repository = "https://github.com/nuroctane/nur-cli"
readme = "README.md"
keywords = ["nur", "nurcli", "ai", "cli", "agent", "tui", "coding-agent", "graphify", "skills"]
categories = ["command-line-utilities", "development-tools"]

# Single binary: `nur`.
[[bin]]
name = "nur"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "rustls", "blocking", "form", "query", "http2", "system-proxy"], default-features = false }
helix-ast = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.6"
dirs = "7"
thiserror = "2"
ratatui = "0.30.2"
# Markdown block structure for the transcript composer. Same version
# tui-markdown already pulls in, so this adds no new node to the tree -
# tui-markdown stays the inline/code styling engine, this parses structure.
pulldown-cmark = { version = "0.13", default-features = false }
# Update these together: they share ratatui-core and terminal backend types.
tui-markdown = "0.3.10"

tui-scrollview = "0.6.8"
# Inline image peeks (sixel/kitty/iTerm2). Heavy (image codecs) — behind the
# default `image-peek` feature so `--no-default-features` yields a leaner build.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"], optional = true }
crossterm = "0.29"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
ignore = "0.4"
futures-util = "0.3"
tokio-util = "0.7"
unicode-width = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
colored = "3"
arboard = "3"
sha2 = "0.11.0"
base64 = "0.23.1"
minisign-verify = "0.2"
# The first-party skill pack is a release asset (`nur-skills.zip`), not a set
# of include_str! bodies; already in the tree through anydoc.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# ZCode credential store decryption (enc:v1 AES-256-GCM envelopes).
aes-gcm = "0.11.1"
# Firecrawl anydoc — local office/PDF → GFM (nickscamara / firecrawl/anydoc).
# Optional so lean builds can drop the document stack.
anydoc = { version = "0.2.4", optional = true }
# `codemode`: the JS sandbox a script runs in. Boa is pure Rust (no C
# toolchain, no ambient fs/net/process), so the tool bridge really is the only
# way out of a script. Optional so a lean build can drop the engine.
boa_engine = { version = "0.22", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
# killpg for shell process groups (std has no group kill).
libc = "0.2"

[features]
default = ["image-peek", "anydoc", "codemode"]
# Inline image peeks in the TUI via ratatui-image + the image codecs.
# Disable (`--no-default-features`) to drop the heavy image stack; peeks then
# fall back to the text/diff view.
image-peek = ["dep:ratatui-image", "dep:image"]
# Local document conversion (PDF/DOCX/PPTX/…) via Firecrawl anydoc.
anydoc = ["dep:anydoc"]
# One model turn that calls several read-only tools, as a script instead of a
# round trip each. Without it the `codemode` tool is not offered at all.
codemode = ["dep:boa_engine"]

[profile.release]
# Ship smaller, load faster binaries:
# - strip symbols (29MB -> ~12-14MB typical for this tree) so release downloads
#   and disk-mapped startup are cheaper;
# - thin-local LTO + one codegen unit: cross-crate inlining without the very
#   long full-LTO link; opt-level 3 stays default.
strip = true
lto = "thin"
codegen-units = 1
