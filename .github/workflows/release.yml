# Release pipeline: build prebuilt binaries for Windows / macOS / Linux on a
# version tag (v*), then publish them to the GitHub Release.
#
# Asset names are load-bearing: `nur update` / `npx nur-cli` pick assets by
# name via `pick_nur_release_asset` in src/bootstrap.rs:
#   nur-windows-x86_64.exe · nur-macos-aarch64 · nur-macos-x86_64 · nur-linux-x86_64
# Keep names in sync when adding targets.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nur-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: nur-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: nur-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: nur-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/nur.exe" "${{ matrix.asset }}"
          Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256 |
            Format-List | Out-String | Set-Content "${{ matrix.asset }}.sha256"

      - name: Stage asset (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/nur" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
