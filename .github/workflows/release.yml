# Release pipeline: build prebuilt binaries for Windows / macOS / Linux on a
# version tag (v*), then publish them to the GitHub Release.
#
# Asset names are load-bearing: `nur update` / `npx nur-cli` pick assets by
# name via `pick_nur_release_asset` in src/bootstrap.rs:
#   nur-windows-x86_64.exe · nur-macos-aarch64 · nur-macos-x86_64 · nur-linux-x86_64
# Keep names in sync when adding targets.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nur-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: nur-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: nur-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: nur-linux-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/nur.exe" "${{ matrix.asset }}"
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content "${{ matrix.asset }}.sha256" -Encoding ascii

      - name: Stage asset (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/nur" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
