# Release pipeline: build prebuilt binaries for Windows / macOS / Linux on a
# version tag (v*), sign them with minisign (pinned public key in
# src/bootstrap.rs), then publish them to the GitHub Release.
#
# Asset names are load-bearing: `nur update` / `npx nur-cli` pick assets by
# name via `pick_nur_release_asset` in src/bootstrap.rs:
#   nur-windows-x86_64.exe · nur-macos-aarch64 · nur-macos-x86_64 · nur-linux-x86_64
# Every binary must ship with a `<asset>.minisig` - the updater refuses
# unsigned assets. The secret key is the MINISIGN_SECRET_KEY repo secret.
# Keep names in sync when adding targets.
#
# `nur-skills.zip` is the first-party skill pack (scripts/build_skill_pack.py,
# manifest skills/bundled.json). `ecosystem ensure` downloads the one for its
# own version and verifies `nur-skills.zip.minisig` against the same key, so
# the pack is signed and published alongside the binaries.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: nur-windows-x86_64.exe
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: nur-macos-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: nur-macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: nur-linux-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches package versions
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          npm_version = json.loads(pathlib.Path('npm/package.json').read_text())['version']
          if tag != f'v{version}' or npm_version != version:
              raise SystemExit(f'Release mismatch: tag={tag}, Rust={version}, npm={npm_version}')
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
          # Match rust-toolchain.toml so rustup never installs mid-build.
          components: clippy, rustfmt

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NUR_NO_UPDATE = '1'
          $version = & "target/${{ matrix.target }}/release/nur.exe" --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "nur $($env:GITHUB_REF_NAME.TrimStart('v'))") {
            throw "Built binary does not match release tag: $version"
          }
          Copy-Item "target/${{ matrix.target }}/release/nur.exe" "${{ matrix.asset }}"
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content "${{ matrix.asset }}.sha256" -Encoding ascii

      - name: Stage asset (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/nur" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  skills:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build skill pack
        run: python scripts/build_skill_pack.py --out nur-skills.zip
      # Skills market index: discovery from skills/market-sources.json, every
      # entry pinned to its author's commit with per-file sha256. Signed with
      # the binaries below (it matches dist/nur-*). A failed build (GitHub API
      # trouble) ships a release without an index; clients then report the
      # market unavailable, so it must not block the release.
      - name: Build skills market index
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_market_index.py --out nur-market-index.json
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nur-skills.zip
          path: |
            nur-skills.zip
            nur-skills.zip.sha256
            nur-market-index.json
          if-no-files-found: error

  publish:
    needs: [build, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Install rsign2 (minisign)
        run: cargo install rsign2 --locked

      - name: Sign binaries (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          for f in dist/nur-*; do
            case "$f" in
              *.sha256|*.minisig) continue ;;
            esac
            rsign sign -W -s "$key" -x "$f.minisig" -t "nur ${GITHUB_REF_NAME} signed by CI" "$f"
          done
          rm -f "$key"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
