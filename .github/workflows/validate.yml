name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        # Every platform the release matrix ships gets the same harness;
        # macos-latest is the Apple-silicon runner the aarch64 asset builds on.
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Check the binary and test targets serially on hosted runner memory.
      CARGO_BUILD_JOBS: '1'
      NUR_HOME: ${{ github.workspace }}/target/nur-validation
      NUR_DISABLE_NATIVE_MEMORY: '1'
      NUR_NO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.97.0'
          # Exactly what rust-toolchain.toml lists: a missing one is
          # auto-installed by the first rustc call, which collided with the
          # runner image's cargo-fmt on ubuntu-latest.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: validate-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: taiki-e/install-action@3b728f3d612841223d50b6bc8f2addad110e6918 # nextest
        with:
          tool: nextest@0.9.150
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - run: python -m pip install pyte
      - run: python tests/test_skill_maintenance.py
      - run: python tests/test_headroom_helper.py
      - run: python scripts/generate_skill_intents.py --check
      - run: python scripts/check_skill_snapshot.py
      - run: python scripts/check_vendored_credentials.py
      - run: python scripts/build_skill_pack.py --check
      - run: python scripts/check_docs.py
      - run: cargo clippy --all-targets --no-default-features --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo nextest run --bin nur --locked
      - run: cargo build --bin nur --locked
      - run: python tests/e2e/run_e2e.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_gateway.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_self_tune.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_acp.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_acp_cancel.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_acp_cancel.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }} --http
      - run: python tests/e2e/run_acp_concurrent.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_debug_cancel.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_startup.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_release_ui.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python tests/e2e/run_regressions.py --bin target/debug/nur${{ runner.os == 'Windows' && '.exe' || '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: harness-${{ matrix.os }}
          path: |
            target/e2e
            target/startup-e2e
            target/regression-e2e
