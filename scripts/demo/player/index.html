<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NurCLI demo</title>
<link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="/player/player.css">
</head>
<body>
<div id="stage">
  <canvas id="backdrop"></canvas>
  <div id="glow"></div>
  <div id="world">
    <div id="window">
      <div id="titlebar">
        <span class="lights"><i class="close"></i><i class="min"></i><i class="max"></i></span>
        <span class="title"><b>nur</b><span class="sep"></span>calc</span>
      </div>
      <div id="term"></div>
      <div id="sheen"></div>
    </div>
  </div>
  <div id="title-card">
    <img id="app-icon" src="/assets/logo.png" alt="">
    <div class="title-text">
      <div class="wordmark">NurCLI</div>
      <div class="display-line">Spend context like it matters.</div>
    </div>
  </div>
  <div id="end-card">
    <div class="end-row">
      <img src="/assets/logo.png" alt="">
      <div>
        <div class="wordmark">NurCLI</div>
        <div class="display-line">65 providers. One terminal. Every token accounted for.</div>
      </div>
    </div>
    <div class="install"><span class="prompt">$</span>npx nur-cli</div>
    <div class="url">nuroctane.xyz/cli</div>
  </div>
  <div id="captions"></div>
  <div id="keys"></div>
  <div id="pointer">
    <div class="ripple"></div>
    <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
      <path d="M7 3.5v19.2l4.6-4.4 2.9 6.9 3.2-1.4-2.9-6.7h6.4z" fill="#fff" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="grain"></div>
  <div id="fade"></div>
</div>
<div id="scrub" hidden>
  <button id="play">pause</button>
  <input id="seek" type="range" min="0" max="100" step="0.01" value="0">
  <span id="clock">0.00</span>
</div>
<script src="/node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="/node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
<script src="/player/storyboard.js"></script>
<script src="/player/player.js"></script>
</body>
</html>
